[package]
name = "seam-host"
description = "The format-agnostic plugin trait, and its VST3 and C ABI exporters behind features"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords = ["audio", "plugin", "vst3", "juce"]
categories = ["multimedia::audio", "api-bindings"]
publish.workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
# VST3, natively in Rust: parameters, automation, state, bus layouts and a
# main-thread timer, for Windows and macOS. No MIDI reaches a plugin through
# it yet.
vst3 = ["dep:vst3", "dep:windows-sys"]
# The C ABI and generated header the JUCE adapter (AU, AUv3, AAX, hosting)
# is driven by.
cabi = []
# The test hosts, `vst3::TestHost` and `cabi::TestHost`, which drive a plugin
# through an exporter in tests: for a plugin crate's dev-dependencies, so a
# shipping plugin carries none of it.
test-host = []

[dependencies]
seam-params.workspace = true
seam-session.workspace = true
seam-ump.workspace = true
serde_json.workspace = true
vst3 = { workspace = true, optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, optional = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(loom)'.dependencies]
loom.workspace = true

[dev-dependencies]
seam-learn.workspace = true
seam-testkit.workspace = true
seam-undo.workspace = true

[lints]
workspace = true
