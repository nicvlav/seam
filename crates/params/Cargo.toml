[package]
name = "seam-params"
description = "Parameters declared once: one real-units store per parameter, writes told apart by origin, gestures, and change counters for polling"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords = ["audio", "plugin", "parameters", "automation", "lock-free"]
categories = ["multimedia::audio", "concurrency"]
publish.workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
# `#[derive(Params)]`, which writes a struct's `declare`.
derive = ["dep:seam-macros"]

[dependencies]
seam-macros = { workspace = true, optional = true }

[dev-dependencies]
proptest.workspace = true
seam-testkit.workspace = true
iai-callgrind.workspace = true

[target.'cfg(loom)'.dependencies]
loom.workspace = true

[lints]
workspace = true

[[test]]
name = "derive"
required-features = ["derive"]

[[bench]]
name = "iai"
harness = false
