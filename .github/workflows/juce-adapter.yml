name: JUCE adapter

# The example EQ built through adapters/juce for arm64 and x86_64, at the JUCE
# commit bench/ pins, and its Windows VST3 through the Steinberg validator.
#
# Started by hand, from any branch: after a change to the adapter or to the C
# interface it drives, and for the commit a release is cut from. It builds
# JUCE twice and takes minutes on the two dearest systems, so it is no part of
# the pull request gate, and it has no schedule, since JUCE, the SDK and the
# toolchain are all pinned.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: juce-adapter-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  universal:
    name: universal build (macos-15)
    timeout-minutes: 30
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Toolchain
        run: |
          rustup toolchain install
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          rustup show active-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: JUCE commit
        run: |
          commit="$(grep -oE 'GIT_TAG [0-9a-f]{40}' bench/CMakeLists.txt | head -1 | cut -d' ' -f2)"
          test -n "$commit"
          echo "JUCE_COMMIT=$commit" >> "$GITHUB_ENV"
      - name: Configure
        run: >
          cmake -S .github/juce-adapter -B build
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
          -DSEAM_CHECK_JUCE_COMMIT="$JUCE_COMMIT"
      - name: Build
        run: cmake --build build --config Release --parallel 4
      - name: Both architectures
        run: |
          status=0
          vst3="$(find build -path '*.vst3/Contents/MacOS/*' -type f)"
          component="$(find build -path '*.component/Contents/MacOS/*' -type f)"
          # The library alone would keep the list non-empty, and one format
          # built would hide the other missing.
          test -n "$vst3" || { echo "no VST3 binary was built"; exit 1; }
          test -n "$component" || { echo "no AU binary was built"; exit 1; }
          plugins="$(printf '%s\n%s' "$vst3" "$component")"
          binaries="$(ls build/seam-cargo/universal/*.a; echo "$plugins")"
          echo "$binaries"
          while IFS= read -r binary; do
            info="$(lipo -info "$binary")"
            echo "$info"
            case "$info" in
              *arm64*x86_64*|*x86_64*arm64*) ;;
              *) echo "not universal: $binary"; status=1 ;;
            esac
          done <<< "$binaries"
          test "$status" = 0

  # The adapter's Windows VST3 through the same validator, at the same pinned
  # SDK commit, as ci.yml's `validators` lane. Keep the two pins and the
  # cache key in step: the lanes share one built validator.
  vst3-validator:
    name: vst3 validator (windows)
    timeout-minutes: 30
    runs-on: windows-2025
    env:
      VST3_SDK_TAG: v3.8.1_build_84
      VST3_SDK_COMMIT: 3cdf9ca5d1f5b1b21e0a86832aa4abe55607bd96
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Toolchain
        run: |
          rustup toolchain install
          rustup show active-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: JUCE commit
        shell: bash
        run: |
          commit="$(grep -oE 'GIT_TAG [0-9a-f]{40}' bench/CMakeLists.txt | head -1 | cut -d' ' -f2)"
          test -n "$commit"
          echo "JUCE_COMMIT=$commit" >> "$GITHUB_ENV"
      - name: Configure
        run: cmake -S .github/juce-adapter -B build "-DSEAM_CHECK_JUCE_COMMIT=$env:JUCE_COMMIT"
      - name: Build
        run: cmake --build build --config Release --parallel 4
      - name: The validator, if built before
        id: cached
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: vst3sdk-build/bin/Release
          key: vst3-validator-${{ env.VST3_SDK_COMMIT }}
      - name: Build the validator
        if: steps.cached.outputs.cache-hit != 'true'
        shell: bash
        run: |
          git clone --depth 1 --branch "$VST3_SDK_TAG" --recurse-submodules --shallow-submodules https://github.com/steinbergmedia/vst3sdk.git vst3sdk
          test "$(git -C vst3sdk rev-parse HEAD)" = "$VST3_SDK_COMMIT"
          cmake -S vst3sdk -B vst3sdk-build -DSMTG_ENABLE_VSTGUI_SUPPORT=OFF -DSMTG_ENABLE_VST3_PLUGIN_EXAMPLES=OFF -DSMTG_ENABLE_VST3_HOSTING_EXAMPLES=OFF -DSMTG_RUN_VST_VALIDATOR=OFF
          cmake --build vst3sdk-build --config Release --target validator --parallel 4
      - name: Validate
        shell: bash
        run: |
          bundle="$(find build -type d -path '*_artefacts*' -name '*.vst3' | head -1)"
          test -n "$bundle" || { echo "no VST3 bundle was built"; exit 1; }
          echo "$bundle"
          vst3sdk-build/bin/Release/validator.exe "$bundle"
